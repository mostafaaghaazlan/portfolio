name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid publish.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24 so the bundled npm matches the major that package.json pins under
          # `packageManager`, which keeps Corepack from wanting a different one.
          node-version: 24
          cache: npm

      # `packageManager: npm@...` in package.json exists to stop nypm reaching for
      # pnpm during `nuxt prepare`. The side effect is that an active Corepack tries
      # to fetch that exact npm before running anything and fails within seconds if
      # it cannot. These two make Corepack tolerant instead of strict, and are
      # no-ops when Corepack is not managing the package manager.
      - name: Install dependencies
        env:
          COREPACK_ENABLE_STRICT: '0'
          COREPACK_ENABLE_AUTO_PIN: '0'
        run: npm ci

      # A user site (<user>.github.io) is served from the domain root, a project
      # site from /<repo>/. Derive the correct Nuxt app.baseURL from the repo name
      # so this workflow works unchanged for either.
      - name: Resolve base path
        id: base
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo/" >> "$GITHUB_OUTPUT"
          fi

      # `generate` prerenders every route to static HTML, including each
      # /work/<slug> page, which is what Pages needs. Plain `build` would emit a
      # server bundle Pages cannot run.
      - name: Build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run generate

      # The static fallback body in app/spa-loading-template.html is plain HTML, so
      # its "Back home" link cannot be interpolated with app.baseURL at build time.
      # It ships pointing at '/', which is right for a user site and wrong for a
      # project site, so repoint it when the base is not the domain root.
      - name: Point the 404 fallback link at the deployment base
        if: steps.base.outputs.path != '/'
        run: sed -i 's|href="/"|href="${{ steps.base.outputs.path }}"|g' .output/public/404.html

      # Nuxt writes .nojekyll into the output, which Pages needs or it refuses to
      # serve the _nuxt directory. Fail loudly here rather than shipping a site
      # whose CSS and JS all 404.
      - name: Check .nojekyll survived the build
        run: test -f .output/public/.nojekyll

      # `enablement: true` lets this step switch Pages on by itself using the
      # `pages: write` permission above, and sets the source to this workflow. That
      # matters because the repository is currently set to deploy from a branch,
      # which serves README.md through Jekyll instead of the built site.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
